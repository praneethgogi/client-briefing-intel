# Local Nginx for Client Briefing Intelligence.
# Serves the production React build and proxies /api to uvicorn on :8000,
# so everything is one origin on http://localhost:8080 .
worker_processes  1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       8080;
        server_name  localhost;

        root  "C:/Users/saipr/OneDrive/Desktop/1-InterviewPrep/Morgan-Stanley-Assessment/client-briefing-intel/frontend/dist";
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # A briefing fans out to several model calls; 60s is too tight.
            proxy_connect_timeout 10s;
            proxy_read_timeout   180s;
            proxy_send_timeout   180s;
        }
    }
}
