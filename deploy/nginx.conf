# Nginx in front of the app: it serves the built React bundle and is the only
# thing exposed. The API is reached through the same origin at /api, so there is
# no CORS surface and the browser never talks to uvicorn directly.

upstream cbi_api {
    server api:8000;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves people on a stale bundle pointing at assets that are gone.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass         http://cbi_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Briefings fan out to several model calls; the default 60s is too tight.
        proxy_connect_timeout 10s;
        proxy_read_timeout   180s;
        proxy_send_timeout   180s;
    }

    client_max_body_size 4m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
