name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - name: Unit tests
        run: cd backend && pytest -q
      - name: Evaluation gate (offline, deterministic)
        run: python -m evals.run_evals --offline
      - name: First-run smoke test (starts the API from an empty store, no API key)
        run: python scripts/smoke_test.py
      - name: LLM evaluation (only when the repo has an OPENAI_API_KEY secret)
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m evals.run_evals
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm install && npm run build
